# Alembic configuration (FR-DAT-006).
# After the first migration exists, every schema change goes through Alembic —
# no manual edits to database/init.sql (Architecture §14.2).
#
#   alembic revision --autogenerate -m "describe the change"
#   alembic upgrade head
#   alembic downgrade -1
#
# The database URL is NOT written here. env.py reads it from the environment
# through app/core/config.py, the single entry point for secrets (P16).

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
